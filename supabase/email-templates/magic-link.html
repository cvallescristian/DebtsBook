<div style="background-color:#f4f4f7;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
    <tr>
      <td style="padding:40px 32px 32px 32px;text-align:center;">
        <div style="width:56px;height:56px;margin:0 auto 20px auto;background-color:#007AFF;border-radius:14px;display:table;">
          <div style="display:table-cell;vertical-align:middle;text-align:center;color:#ffffff;font-size:26px;font-weight:700;">D</div>
        </div>
        <h1 style="margin:0 0 8px 0;font-size:20px;line-height:28px;color:#1a1a1a;font-weight:600;">Sign in to DebtsBook</h1>
        <p style="margin:0 0 28px 0;font-size:14px;line-height:20px;color:#6b6b70;">
          Enter this code in the app to continue.
        </p>
        <div style="background-color:#f4f4f7;border-radius:12px;padding:20px;margin-bottom:24px;">
          <span style="font-size:32px;font-weight:700;letter-spacing:6px;color:#1a1a1a;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</span>
        </div>
        <p style="margin:0;font-size:13px;line-height:18px;color:#9a9aa0;">
          This code expires shortly and can only be used once. If you didn't request this, you can safely ignore this email.
        </p>
      </td>
    </tr>
  </table>
  <p style="max-width:420px;margin:20px auto 0 auto;text-align:center;font-size:12px;color:#b0b0b6;">
    DebtsBook
  </p>
</div>
