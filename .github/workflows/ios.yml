name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test DebtsBook on an iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check views write through DataStore
        run: ./scripts/check-data-store.sh
      - name: Create placeholder Secrets.swift
        # Secrets.swift is git-ignored; tests don't hit Supabase, so the template's placeholders are enough to compile.
        run: cp DebtsBook/DebtsBook/Secrets.swift.example DebtsBook/DebtsBook/Secrets.swift
      - name: Install iOS simulator runtime
        # The runner's preinstalled runtimes can be older than IPHONEOS_DEPLOYMENT_TARGET.
        # Retried because the download intermittently fails with "Unable to connect to simulator".
        run: |
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
      - name: Pick simulator
        run: |
          device_id=$(xcodebuild -showdestinations -scheme DebtsBook -project DebtsBook.xcodeproj 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -oE 'id:[A-F0-9-]+' | head -1 | cut -d: -f2)
          if [ -z "$device_id" ]; then echo "No eligible iPhone simulator found"; exit 1; fi
          echo "Using simulator: $device_id"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Build
        run: xcodebuild build-for-testing -scheme DebtsBook -project DebtsBook.xcodeproj -destination "id=$DEVICE_ID"
      - name: Test
        # One retry absorbs simulator flakes; a real bug fails both runs.
        run: |
          xcodebuild test-without-building -scheme DebtsBook -project DebtsBook.xcodeproj -destination "id=$DEVICE_ID" \
            -retry-tests-on-failure -test-iterations 2 -resultBundlePath TestResults.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
