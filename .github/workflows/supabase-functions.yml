name: Supabase Edge Functions

on:
  push:
    branches: [ "main" ]
    paths: [ "supabase/functions/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "supabase/functions/**" ]

jobs:
  test:
    name: Test Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test
        run: deno test supabase/functions/
